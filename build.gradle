plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()

    // =========================================================================
    // РЕПОЗИТОРИИ МОД-ЗАВИСИМОСТЕЙ (CurseMaven / Modrinth / BlameJared)
    // =========================================================================

    // CurseMaven — прокси над CurseForge: позволяет тянуть jar'ы модов как maven-артефакты.
    // Формат зависимости: "curse.maven:<project-slug>-<numeric-project-id>:<file-id>"
    maven {
        name = 'CurseMaven'
        url = 'https://api.curse.tools/v1/curse/'
        content { includeGroup 'curse.maven' }
    }

    // Modrinth Maven — более современный и стабильный вариант для Create на NeoForge.
    // Формат: "maven.modrinth:<project-id>:<version-id-or-range>"
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    // BlameJared maven — официальный maven JEI/patcher; нужен, если захочешь
    // compileOnly-зависимость от API-артефактов Create (см. комментарии в dependencies).
    maven {
        name = 'ParchmentMC' // mappings уже заданы в neoForge{}, но держим на всякий случай
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'Cosmopolitan (Create public maven)' // зеркало артефактов simibubi/Create
        url = 'https://maven.jaredlll08.com/releases'
        content { includeGroupByRegex 'com\.simibubi.*' }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // =====================================================================
    // ЗАВИСИМОСТИ МОДА-БРИДЖА
    //
    // ВАЖНО ПРО НОВИЧКА: нам НЕ нужны .java-классы этих модов для компиляции,
    // потому что мы общаемся с ними через:
    //   1) строковые ID блоков/жидкостей (Registries + ResourceLocation),
    //   2) стандартную NeoForge Capability FluidHandler.BLOCK,
    //   3) рефлексивный «мост» к Cold Sweat (см. ColdSweatBridge.java).
    // Поэтому достаточно runtimeOnly — jar просто кладётся в run/mods.
    // =====================================================================

    // --- Create 6 (NeoForge port для 1.21.1) через MODRINTH ------------------
    // Project id на Modrinth: "create". Версию смотри на странице мода -> Versions.
    // Если artifact с таким именем не найдётся — скачай jar вручную с Modrinth
    // и положи в libs/ (заглушка ниже подключена).
    runtimeOnly "maven.modrinth:create:${create_version}"

    // --- Cold Sweat через CURSEMEN ------------------------------------------------
    // CurseForge project cold-sweat: https://www.curseforge.com/minecraft/mc-mods/cold-sweat
    // На CurseMaven id берётся из URL страницы файлов: curse.maven:cold-sweat-<PROJECT_ID>:<FILE_ID>
    // PROJECT_ID и FILE_ID нужно подставить актуальные (см. инструкцию в README-комментарии).
    // Заглушка: если numeric ids неизвестны, скачай jar Cold Sweat (NeoForge 1.21.1)
    // с CurseForge и раскомментируй file-dependency внизу.
    // runtimeOnly "curse.maven:cold-sweat-XXXXXX:YYYYYYY"

    // --- Create: Going Nuclear ------------------------------------------------------
    // ВНИМАНИЕ: актуальный порт Going Nuclear под NeoForge 1.21 может отсутствовать
    // на maven. Наш код НЕ требует его классов — реакторы обнаруживаются по whitelist
    // ID блоков из конфига (Config.reactorBlockWhitelist), который ты пополняешь сам.
    // Когда получишь jar — просто добавь его в run/mods/, ничего в коде менять не надо.
    // runtimeOnly files('libs/going-nuclear-neoforge.jar')

    // --- Локальные заглушки (fallback, если maven недоступен) --------------------
    // Положи скачанные jar'ы в ./libs — Gradle подхватит их автоматически:
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Если захочешь вызывать API Create напрямую (а не через capabilities),
    // добавь compileOnly-зависимость и зарегистрируй её классы в IDE:
    // compileOnly "maven.modrinth:create:${create_version}"

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// ModDev plugin должен видеть эти jar'ы в classpath рантайм-прогона:
neoForge {
    runs.configureEach {
        mods {
            // Create/Cold Sweat подгружаются как обычные моды из run/mods при запуске
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
